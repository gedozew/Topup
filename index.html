<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Top Up E-Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>💳 Top Up E-Wallet</h2>

  <!-- STEP 1 -->
  <div id="step1">
    <p>Pilih E-Wallet:</p>
    <button onclick="pilihWallet('DANA')">DANA</button>
    <button onclick="pilihWallet('OVO')">OVO</button>
    <button onclick="pilihWallet('GOPAY')">GOPAY</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <p id="walletSelected"></p>
    <input type="text" id="nomor" placeholder="Masukkan Nomor">
    <button onclick="lanjutNomor()">Lanjut</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <p>Pilih Nominal:</p>
    <button onclick="pilihNominal(10000)">10.000</button>
    <button onclick="pilihNominal(20000)">20.000</button>
    <button onclick="pilihNominal(50000)">50.000</button>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="hidden">
    <p id="ringkasan"></p>
    <button class="bayar" onclick="bayar()">Bayar</button>
  </div>

  <div id="loading" class="hidden">⏳ Memproses...</div>
  <div id="status"></div>

</div>

<script src="script.js"></script>
</body>
</html>
