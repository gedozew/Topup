<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Top Up E-Wallet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <h1>Top Up E-Wallet</h1>

  <!-- WALLET -->
  <div class="wallet-list">
    <div class="card" onclick="selectWallet('DANA')">DANA</div>
    <div class="card" onclick="selectWallet('OVO')">OVO</div>
    <div class="card" onclick="selectWallet('GOPAY')">GOPAY</div>
  </div>

  <!-- FORM -->
  <div id="form" class="hidden">

    <input type="text" id="nomor" placeholder="Masukkan nomor HP">

    <div class="nominal">
      <button onclick="selectNominal(10000)">10K</button>
      <button onclick="selectNominal(20000)">20K</button>
      <button onclick="selectNominal(50000)">50K</button>
    </div>

    <button class="pay" onclick="bayar()">Bayar</button>

  </div>

  <p id="status"></p>

</div>

<script src="script.js"></script>
</body>
</html>
